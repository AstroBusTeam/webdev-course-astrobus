<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi perfil con dos tarjetas</title>
  <style>
    body {
      background-color: #e0f2fe;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .tarjeta {
      background-color: white;
      max-width: 400px;
      margin: 0 auto 20px auto;
      padding: 20px;
      border: 3px solid #0284c7;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    h1, h2 {
      color: #0369a1;
    }
    img {
      border-radius: 50%;
    }
    ul {
      list-style-position: inside;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1>Hola, soy Alex</h1>
    <img src="https://placehold.co/200x200" alt="Foto de perfil">
    <p>Tengo 14 años y me encanta crear cosas nuevas.</p>
    <h2>Mis pasatiempos</h2>
    <ul>
      <li>Dibujar</li>
      <li>Jugar fútbol</li>
      <li>Escuchar música</li>
    </ul>
  </div>

  <div class="tarjeta">
    <h2>Mis metas</h2>
    <ul>
      <li>Crear mi primera página web</li>
      <li>Aprender JavaScript</li>
      <li>Hacer un videojuego sencillo</li>
    </ul>
  </div>
</body>
</html>
