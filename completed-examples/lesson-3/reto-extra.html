<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi receta favorita</title>
</head>
<body>
  <h1>Panqueques esponjosos</h1>
  <img src="https://placehold.co/300x200" alt="Plato con panqueques">

  <h2>Ingredientes</h2>
  <ul>
    <li>1 taza de harina</li>
    <li>1 huevo</li>
    <li>1 taza de leche</li>
  </ul>

  <h2>Pasos</h2>
  <ol>
    <li>Mezcla los ingredientes en un recipiente.</li>
    <li>Calienta una sartén con un poco de aceite.</li>
    <li>Cocina cada panqueque hasta que se dore.</li>
  </ol>

  <p>Mira más recetas en <a href="https://developer.mozilla.org/es/" target="_blank">este sitio</a>.</p>
</body>
