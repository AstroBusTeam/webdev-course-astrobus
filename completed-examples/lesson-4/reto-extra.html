<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Receta con estilo</title>
  <style>
    body {
      background-color: #fff7ed;
      font-family: Georgia, serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      color: #9a3412;
      text-align: center;
    }
    h2 {
      color: #c2410c;
      border-bottom: 2px solid #fdba74;
    }
    li {
      color: #7c2d12;
      margin-bottom: 4px;
    }
    img {
      display: block;
      margin: 0 auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>Panqueques esponjosos</h1>
  <img src="https://placehold.co/300x200" alt="Plato con panqueques">

  <h2>Ingredientes</h2>
  <ul>
    <li>1 taza de harina</li>
    <li>1 huevo</li>
    <li>1 taza de leche</li>
  </ul>

  <h2>Pasos</h2>
  <ol>
    <li>Mezcla los ingredientes en un recipiente.</li>
    <li>Calienta una sartén con un poco de aceite.</li>
    <li>Cocina cada panqueque hasta que se dore.</li>
  </ol>
</body>
</html>
